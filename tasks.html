<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title> Task | TaskMe </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tasks.css" type="text/css">
</head>

<body>

    <label>

        <div class="main">
            <div class="sidebar">

                <h2> TaskMe </h2>
                <ul>
                    <li> <a href="homepage.html"> <i class="fa-solid fa-house"> </i> Home </a></li>
                    <li> <a href="tasks.html"> <i class="fa-solid fa-list-check"> </i> Task </a></li>
                    <li> <a href="calendar.html"> <i class="fa-solid fa-calendar-days"> </i> Calender </a></li>
                    <li> <a href="landing.html"> <i class="fas fa-sign-out-alt"> </i> Log out </a></li>
                </ul>
            </div>
        </div>
    </label>

    <main class="content">
        <h1> <i class="fa-solid fa-list-check"> </i> Task </h1>
    </main>

    <div class="container">
        <header>
            <div class="my-day">
                <h1> <i class="fa-solid fa-sun"></i> My Day</h1>
            </div>
            <div class="reminder-icon">
                <i class="fa-solid fa-bell"> </i>
            </div>
            <div class="view-toggle">
                <button id="gridView" class="view-button">Grid</button>
                <button id="listView" class="view-button">List</button>
            </div>
        </header>

        <div class="task-input">

            <input type="text" id="newTask" placeholder="Enter your task here...">
            <div class="task-options">
                <input type="date" id="dueDate">
                <select id="priority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <div class="progress-options">
                <label> Progress: </label>
                <button class="circle-btn not-started" data-status="not-started" title="Not Started"></button>
                <button class="circle-btn in-progress" data-status="in-progress" title="In Progress"></button>
                <button class="circle-btn completed" data-status="completed" title="Completed"></button>
            </div>

            <button id="addTaskBtn">Add</button>

        </div>


        <footer>
            <div class="footer-controls">
                <button id="sortBtn" class="sort-button">Sort</button>
                <button id="groupBtn" class="group-button">Group</button>
                <button id="suggestionsBtn" class="suggestions-button">Suggestions</button>
            </div>
        </footer>

    </div>

    <table id="taskTable">
        <thead>
            <tr>
                <th>Task</th>
                <th>Due Date</th>
                <th>Priority</th>
                <th>Progress</th>
            </tr>



        </thead>
        <tbody id="taskList">
        </tbody>
    </table>

    <script src="task.js"> </script>

</body>


</html>

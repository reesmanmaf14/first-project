<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title> Home | TaskMe </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/home.css" type="text/css">

</head>

<body>


    <label>

        <div class="main">
            <div class="sidebar">

                <h2> TaskMe </h2>
                <ul>
                    <li> <a href="homepage.html"> <i class="fa-solid fa-house"> </i> Home </a></li>
                    <li> <a href="tasks.html"> <i class="fa-solid fa-list-check"> </i> Task </a></li>
                    <li> <a href="calendar.html"> <i class="fa-solid fa-calendar-days"> </i> Calender </a></li>
                    <li> <a href="landing.html"> <i class="fas fa-sign-out-alt"> </i> Log out </a></li>

                </ul>
            </div>

        </div>

        <div class="search">
            <form action="">
                <input type="text" placeholder="Search Task" name="search">
                <button class="search button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
        </div>
        </div>
    </label>

    <main class="content">
        <h1> <i class="fa-solid fa-house"> </i> Home </h1>
    </main>




    <div class="home-layout">

        <div class="quick-add">
            <h2> <i class="fa-solid fa-circle-plus"> </i> Quick Add Task </h2>
            <input type="text" placeholder="Enter task..." class="task-input">
            <div class="due-date">

                <input type="date" placeholder="due-date">
            </div>
            <button class="addBtn">Add Task</button>
        </div>


        <div class="upcoming-tasks">
            <h2>Upcoming Tasks</h2>
            <ul class="task-list">
                <li>Write article <span>Due: 2024-11-20</span></li>
                <li>Presentation <span>Due: 2024-11-21</span></li>
                <li>Meeting <span>Due: 2024-11-23</span></li>
            </ul>
        </div>


        <div class="progress-summary">
            <h2>Task Progress</h2>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            <p> 3 tasks completed out of 6 </p>
        </div>
    </div>


</body>

</html>
